name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ hashFiles('deps.edn') }}
          restore-keys: deps-

      # db/ is gitignored; one test opens db/tms_db read-only and needs the seed data.
      - name: Create database
        run: |
          mkdir -p db
          sqlite3 db/tms_db < schema/schema.sql
          sqlite3 db/tms_db < schema/default_load.sql

      - name: Run tests
        run: clojure -M:test
