<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7d5e">
  <!-- Same policy the server sends as a header (api.clj); a meta tag also covers
       the Android app, which has no HTTP headers. frame-ancestors is header-only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Track My Sugar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
    <h1>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2.5c-.4 0-.8.2-1 .5C8.4 6.6 5.5 10 5.5 14a6.5 6.5 0 0 0 13 0c0-4-2.9-7.400-5.500-11-.2-.3-.6-.5-1-.5z"/><path fill="#0b7d5e" fill-opacity=".35" d="M9 14.500a3 3 0 0 0 3 3v-1.500a1.500 1.500 0 0 1-1.500-1.500H9z"/></svg>
      Track My Sugar
      <span id="app-version" class="version" hidden></span>
    </h1>
    <nav>
      <button type="button" class="tab active" data-tab="readings">Readings</button>
      <button type="button" class="tab" data-tab="analytics">Analytics</button>
      <button type="button" class="tab" data-tab="administration">Administration</button>
    </nav>
    </div>
  </header>

  <main>
    <div id="message" role="status" hidden></div>

    <!-- Readings (HEALTH_DETAIL) -->
    <section id="readings" class="panel">
      <form id="reading-form" class="card">
        <h2 id="reading-form-title">Add reading</h2>
        <input type="hidden" name="id">
        <label>Person
          <select name="person_id" required></select>
        </label>
        <label>Metric type
          <select name="metric_type_id" required></select>
        </label>
        <label>Value
          <input type="number" name="health_metric" step="any" inputmode="decimal" required placeholder="e.g. 7.3">
        </label>
        <label>Date &amp; time <small>(defaults to now)</small>
          <input type="datetime-local" name="created_date_time" step="1">
        </label>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" data-cancel>Cancel</button>
        </div>
      </form>

      <div class="card">
        <div class="toolbar">
          <h2>Readings</h2>
          <label>Person <select id="reading-filter-person"></select></label>
          <label>Metric <select id="reading-filter-metric"></select></label>
        </div>
        <table>
          <thead><tr><th>When</th><th>Person</th><th>Metric</th><th class="num">Value</th><th></th></tr></thead>
          <tbody id="reading-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- Analytics -->
    <section id="analytics" class="panel analytics" hidden>
      <form id="analytics-filters" class="card">
        <h2>Filters</h2>
        <label>Person
          <select id="an-person"></select>
        </label>
        <label>Metric type
          <select id="an-metric"></select>
        </label>
        <label>From
          <input type="date" id="an-from">
        </label>
        <label>To
          <input type="date" id="an-to">
        </label>
        <div class="actions">
          <button type="button" class="secondary" id="an-clear">Clear filters</button>
        </div>

        <!-- Exports the readings that match the filters above. -->
        <div class="export">
          <h3>Export filtered readings</h3>
          <div class="actions">
            <button type="button" id="an-export-csv">Download CSV</button>
            <button type="button" id="an-export-json">Download JSON</button>
          </div>
        </div>
      </form>

      <div class="card">
        <h2>Results over time</h2>
        <div id="chart" class="chart"></div>
        <ul id="chart-legend" class="legend"></ul>
        <table id="an-stats">
          <thead><tr><th>Series</th><th class="num">Readings</th><th class="num">Min</th><th class="num">Avg</th><th class="num">Max</th><th class="num">Latest</th></tr></thead>
          <tbody id="an-stat-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- Administration -->
    <section id="administration" class="admin" hidden>
      <nav class="subnav">
        <button type="button" class="subtab active" data-subtab="persons">People</button>
        <button type="button" class="subtab" data-subtab="metric-types">Metric types</button>
      </nav>

    <!-- People (PERSON) -->
    <section id="persons" class="subpanel">
      <form id="person-form" class="card">
        <h2 id="person-form-title">Add person</h2>
        <input type="hidden" name="id">
        <label>Name <input type="text" name="name" required></label>
        <label>Email <input type="email" name="email"></label>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" data-cancel>Cancel</button>
        </div>
      </form>

      <div class="card">
        <h2>People</h2>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th></th></tr></thead>
          <tbody id="person-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- Metric types (METRIC_TYPE) -->
    <section id="metric-types" class="subpanel" hidden>
      <form id="metric-type-form" class="card">
        <h2 id="metric-type-form-title">Add metric type</h2>
        <input type="hidden" name="id">
        <label>Type <input type="text" name="type" required placeholder="e.g. BSL"></label>
        <label>Description <input type="text" name="description" required></label>
        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" class="secondary" data-cancel>Cancel</button>
        </div>
      </form>

      <div class="card">
        <h2>Metric types</h2>
        <table>
          <thead><tr><th>ID</th><th>Type</th><th>Description</th><th></th></tr></thead>
          <tbody id="metric-type-rows"></tbody>
        </table>
      </div>
    </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
